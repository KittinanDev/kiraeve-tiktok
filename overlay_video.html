<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiraeve Video Alerts Overlay</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background: transparent;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #video-container {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    transition: opacity 0.35s ease, transform 0.35s ease;
    opacity: 0;
  }

  #video-container.visible {
    opacity: 1;
  }

  /* Positions */
  #video-container.pos-center {
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  #video-container.pos-top {
    top: 10%;
    left: 50%;
    transform: translate(-50%, 0);
  }

  #video-container.pos-bottom {
    bottom: 10%;
    left: 50%;
    transform: translate(-50%, 0);
  }

  #video-container.pos-left {
    top: 50%;
    left: 10%;
    transform: translate(0, -50%);
  }

  #video-container.pos-right {
    top: 50%;
    right: 10%;
    transform: translate(0, -50%);
  }

  #video-container.pos-fullscreen {
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    transform: none;
  }

  video {
    max-width: 90vw;
    max-height: 90vh;
    object-fit: contain;
    filter: drop-shadow(0 10px 25px rgba(0,0,0,0.65));
  }

  #video-container.pos-fullscreen video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>
</head>
<body>

<div id="video-container" class="pos-center">
  <video id="alert-video" playsinline></video>
</div>

<script>
  const videoContainer = document.getElementById('video-container');
  const alertVideo = document.getElementById('alert-video');

  const videoQueue = [];
  let isPlaying = false;
  let currentPlaybackToken = 0;
  let videoSafetyTimer = null;

  function enqueueVideo(videoData, repeatCount = 1) {
    if (!videoData) return;
    const url = videoData.url || (videoData.video_file ? ('/media/Video/' + encodeURIComponent(videoData.video_file)) : '');
    if (!url) return;

    const count = Math.max(1, Math.min(10, parseInt(repeatCount || videoData.count || 1)));
    for (let i = 0; i < count; i++) {
      videoQueue.push({
        url: url,
        position: videoData.position || 'center',
        scale: videoData.scale !== undefined ? parseFloat(videoData.scale) : 1.0,
        volume: videoData.volume !== undefined ? parseFloat(videoData.volume) : 0.8
      });
    }

    if (!isPlaying) {
      playNextVideo();
    }
  }

  function stopAllVideoPlayback() {
    currentPlaybackToken++;
    if (videoSafetyTimer) {
      clearTimeout(videoSafetyTimer);
      videoSafetyTimer = null;
    }
    videoQueue.length = 0;
    videoContainer.classList.remove('visible');
    try {
      alertVideo.pause();
      alertVideo.currentTime = 0;
      alertVideo.src = '';
    } catch(e) {}
    isPlaying = false;
  }

  function playNextVideo() {
    if (videoQueue.length === 0) {
      isPlaying = false;
      videoContainer.classList.remove('visible');
      return;
    }

    isPlaying = true;
    const myToken = ++currentPlaybackToken;
    const current = videoQueue.shift();

    if (videoSafetyTimer) {
      clearTimeout(videoSafetyTimer);
      videoSafetyTimer = null;
    }

    videoContainer.className = '';
    const pos = current.position || 'center';
    videoContainer.classList.add('pos-' + pos);

    const scale = current.scale !== undefined ? current.scale : 1.0;
    alertVideo.style.transform = 'scale(' + scale + ')';

    alertVideo.volume = current.volume !== undefined ? Math.max(0, Math.min(1, current.volume)) : 0.8;
    alertVideo.muted = false;

    // Remove previous listeners
    alertVideo.onloadedmetadata = null;
    alertVideo.onended = null;
    alertVideo.onerror = null;

    let isVideoFinished = false;
    function finalizeCurrentVideo() {
      if (isVideoFinished || myToken !== currentPlaybackToken) return;
      isVideoFinished = true;
      if (videoSafetyTimer) {
        clearTimeout(videoSafetyTimer);
        videoSafetyTimer = null;
      }
      finishVideo(myToken);
    }

    alertVideo.onloadedmetadata = () => {
      if (myToken !== currentPlaybackToken) return;
      const durationSec = alertVideo.duration;
      // Set safety watchdog timer (video duration + 2s padding, or fallback 25s)
      const timeoutMs = (durationSec && !isNaN(durationSec) && durationSec > 0)
        ? Math.ceil((durationSec + 2) * 1000)
        : 25000;
      videoSafetyTimer = setTimeout(() => {
        finalizeCurrentVideo();
      }, timeoutMs);

      alertVideo.play().then(() => {
        if (myToken === currentPlaybackToken) {
          videoContainer.classList.add('visible');
        }
      }).catch(err => {
        console.warn('Auto-play blocked or video failed:', err);
        finalizeCurrentVideo();
      });
    };

    alertVideo.onended = () => {
      finalizeCurrentVideo();
    };

    alertVideo.onerror = () => {
      console.warn('Video failed to load:', current.url);
      finalizeCurrentVideo();
    };

    // Fallback load timeout if metadata never fires (e.g. 404 or stalled network)
    videoSafetyTimer = setTimeout(() => {
      finalizeCurrentVideo();
    }, 12000);

    alertVideo.src = current.url;
    alertVideo.load();
  }

  function finishVideo(token) {
    if (token !== currentPlaybackToken) return;
    videoContainer.classList.remove('visible');
    setTimeout(() => {
      if (token !== currentPlaybackToken) return;
      try {
        alertVideo.pause();
        alertVideo.currentTime = 0;
        alertVideo.src = '';
      } catch(e) {}
      setTimeout(() => {
        if (token === currentPlaybackToken) {
          playNextVideo();
        }
      }, 150);
    }, 250);
  }

  function connectWebSocket() {
    const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
    const ws = new WebSocket(WS_URL);

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.type === 'refresh_overlays') {
          window.location.reload();
          return;
        }

        if (data.type === 'stop_audio' || data.type === 'stop_video') {
          stopAllVideoPlayback();
          return;
        }

        const vAlert = data.video_effect || data.video_alert;
        if (vAlert) {
          const repeat = data.count || vAlert.count || 1;
          enqueueVideo(vAlert, repeat);
        }
      } catch(e) {}
    };

    ws.onclose = () => {
      setTimeout(connectWebSocket, 1500);
    };

    ws.onerror = () => {
      try { ws.close(); } catch(e){}
    };
  }

  connectWebSocket();
</script>
</body>
</html>
