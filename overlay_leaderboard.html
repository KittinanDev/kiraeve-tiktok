<!DOCTYPE html>
<html lang="th" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Supporters Leaderboard Overlay</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&family=Kanit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
  :root {
    --overlay-scale: 1.0;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    background: transparent;
    font-family: 'Inter', 'Kanit', sans-serif;
    color: #f1f5f9;
    overflow: hidden;
    display: flex;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  body.obs-mode {
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  body.preview-mode {
    align-items: center;
    justify-content: center;
    padding: 12px;
  }

  #scale-wrapper {
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    display: flex;
    justify-content: center;
    transform: scale(var(--overlay-scale));
    transform-origin: center center;
    transition: transform 0.25s ease-out;
  }

  body.preview-mode #scale-wrapper {
    transform-origin: center center;
    transform: scale(calc(var(--overlay-scale) * 0.85));
  }

  .broadcast-panel {
    background: rgba(13, 14, 18, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8), 0 0 1px rgba(255, 255, 255, 0.2) inset;
  }

  .rank-card-1 {
    background: linear-gradient(90deg, rgba(245, 158, 11, 0.16) 0%, rgba(18, 18, 24, 0.9) 100%);
    border: 1px solid rgba(245, 158, 11, 0.45);
    box-shadow: 0 0 20px rgba(245, 158, 11, 0.1);
  }

  .rank-card-2 {
    background: linear-gradient(90deg, rgba(148, 163, 184, 0.12) 0%, rgba(18, 18, 24, 0.9) 100%);
    border: 1px solid rgba(148, 163, 184, 0.3);
  }

  .rank-card-3 {
    background: linear-gradient(90deg, rgba(217, 119, 6, 0.12) 0%, rgba(18, 18, 24, 0.9) 100%);
    border: 1px solid rgba(217, 119, 6, 0.3);
  }

  .rank-card-normal {
    background: rgba(22, 22, 28, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.07);
  }

  @keyframes coinBump {
    0% { transform: scale(1); }
    35% { transform: scale(1.04); filter: brightness(1.2); }
    100% { transform: scale(1); filter: brightness(1); }
  }
  .animate-coin-bump {
    animation: coinBump 0.4s ease-out;
  }
</style>
</head>
<body id="body-el" class="obs-mode">

  <div id="scale-wrapper">
    <div id="leaderboard-widget" class="broadcast-panel w-full max-w-[440px] rounded-2xl p-4 flex flex-col gap-3 shadow-2xl transition-all duration-300">
      
      <!-- Leaderboard Header with Live Indicator -->
      <div class="flex items-center justify-between pb-3 border-b border-white/10 relative">
        <div class="flex items-center gap-2.5 z-10">
          <div class="w-8 h-8 rounded-lg bg-amber-400/20 border border-amber-400/40 flex items-center justify-center text-amber-400 shadow-sm">
            <span class="material-symbols-outlined text-[19px]" style="font-variation-settings: 'FILL' 1;">stars</span>
          </div>
          <div>
            <h2 id="lead-header-title" class="font-bold text-sm text-white tracking-wide uppercase font-sans">
              Top Supporters
            </h2>
            <div class="text-[10px] text-gray-400 font-mono flex items-center gap-1.5 mt-0.5">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse shadow-[0_0_6px_rgba(52,211,153,0.8)]"></span>
              <span class="tracking-widest">LIVE RANKING</span>
            </div>
          </div>
        </div>

        <div class="z-10 bg-black/50 border border-white/15 px-2.5 py-0.5 rounded-full text-[11px] font-mono font-bold text-amber-300 flex items-center gap-1 shadow-inner">
          <span id="lead-count-badge">Top 5</span>
        </div>
      </div>

      <!-- Leaderboard Rows Container -->
      <div id="leaderboard-list" class="flex flex-col gap-2">
        <div class="py-6 text-center text-xs text-gray-400 flex flex-col items-center gap-2">
          <span class="material-symbols-outlined text-gray-500 animate-spin text-xl">sync</span>
          <span class="font-medium">กำลังซิงก์ข้อมูลอันดับ...</span>
        </div>
      </div>

    </div>
  </div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const isPreview = urlParams.get('preview') === 'true';
  const bodyEl = document.getElementById('body-el');
  const scaleWrapperEl = document.getElementById('scale-wrapper');
  const leaderListEl = document.getElementById('leaderboard-list');
  const headerTitleEl = document.getElementById('lead-header-title');
  const countBadgeEl = document.getElementById('lead-count-badge');

  if (isPreview) {
    bodyEl.className = 'preview-mode';
  }

  let currentScale = parseFloat(urlParams.get('scale')) || 1.0;
  let currentTopCount = 5;
  let currentHeaderTitle = 'Top Supporters';
  let prevScores = {};

  function setScale(scaleVal) {
    const s = parseFloat(scaleVal) || 1.0;
    currentScale = s;
    document.documentElement.style.setProperty('--overlay-scale', s);
  }

  setScale(currentScale);

  const AVATAR_GRADIENTS = [
    'from-amber-500 to-red-600',
    'from-blue-500 to-indigo-700',
    'from-purple-500 to-pink-600',
    'from-emerald-500 to-teal-700',
    'from-orange-500 to-amber-700',
    'from-cyan-500 to-blue-600',
    'from-rose-500 to-purple-600'
  ];

  function getAvatarUrl(rawUrl, name) {
    const safeName = encodeURIComponent(name || '');
    if (!rawUrl || typeof rawUrl !== 'string' || !rawUrl.startsWith('http')) {
      return `/api/avatar-proxy?name=${safeName}`;
    }
    return `/api/avatar-proxy?url=${encodeURIComponent(rawUrl)}&name=${safeName}`;
  }

  function renderLeaderboard(gifters) {
    if (!gifters || gifters.length === 0) {
      leaderListEl.innerHTML = `
        <div class="py-6 text-center text-xs text-gray-400 flex flex-col items-center gap-2 bg-black/25 rounded-xl border border-white/5 p-4">
          <span class="material-symbols-outlined text-amber-400/70 text-2xl">workspace_premium</span>
          <span class="font-bold text-sm text-gray-200">ยังไม่มีข้อมูลผู้สนับสนุนในรอบนี้</span>
          <span class="text-xs text-gray-500">ส่งของขวัญเพื่อขึ้นเป็นอันดับ 1 บนหน้าจอไลฟ์</span>
        </div>
      `;
      return;
    }

    const displayed = gifters.slice(0, currentTopCount);
    if (countBadgeEl) {
      countBadgeEl.innerText = `Top ${displayed.length}`;
    }

    const rankLabels = ['01', '02', '03', '04', '05'];

    leaderListEl.innerHTML = displayed.map((g, idx) => {
      const rank = idx + 1;
      let cardClass = 'rank-card-normal';
      let rankBadgeClass = 'text-gray-400 font-bold';
      let avatarBorder = 'border-white/10';

      if (rank === 1) {
        cardClass = 'rank-card-1';
        rankBadgeClass = 'text-amber-400 font-black text-base';
        avatarBorder = 'border-2 border-amber-400 shadow-sm';
      } else if (rank === 2) {
        cardClass = 'rank-card-2';
        rankBadgeClass = 'text-slate-300 font-extrabold text-sm';
        avatarBorder = 'border-2 border-slate-300 shadow-sm';
      } else if (rank === 3) {
        cardClass = 'rank-card-3';
        rankBadgeClass = 'text-amber-500 font-extrabold text-sm';
        avatarBorder = 'border-2 border-amber-600 shadow-sm';
      } else {
        rankBadgeClass = 'text-gray-400 font-bold text-xs';
      }

      const prevCoin = prevScores[g.sender] || 0;
      const isBumped = prevCoin > 0 && g.coins > prevCoin;
      prevScores[g.sender] = g.coins;
      const bumpAnim = isBumped ? 'animate-coin-bump' : '';

      const firstLetter = (g.sender || 'U').trim().charAt(0).toUpperCase();
      const gradClass = AVATAR_GRADIENTS[idx % AVATAR_GRADIENTS.length];
      const directPic = g.profile_picture || '';
      const proxyPic = getAvatarUrl(directPic, g.sender);
      const safeName = encodeURIComponent(g.sender || 'viewer');

      let avatarHtml = `
        <img src="${proxyPic}" 
             referrerpolicy="no-referrer"
             class="w-10 h-10 rounded-full object-cover ${avatarBorder} shadow-sm shrink-0" 
             onerror="this.onerror=null; this.src='/api/avatar-proxy?name=${safeName}';">
      `;

      let giftPreviewHtml = '';
      const giftIconSrc = g.gift_icon || (g.last_gift ? `/api/gift-icon?name=${encodeURIComponent(g.last_gift)}` : '');
      if (giftIconSrc) {
        giftPreviewHtml = `
          <img src="${giftIconSrc}" class="w-4 h-4 object-contain inline-block shrink-0" title="${escapeHtml(g.last_gift || '')}" onerror="this.style.display='none'">
        `;
      }

      return `
        <div class="${cardClass} ${bumpAnim} rounded-xl p-2.5 flex items-center justify-between transition-all duration-300">
          <div class="flex items-center gap-2.5 min-w-0">
            <div class="w-6 text-center ${rankBadgeClass} shrink-0 font-mono">
              ${rankLabels[idx] || rank}
            </div>
            
            <div class="relative shrink-0">
              ${avatarHtml}
            </div>

            <div class="flex flex-col min-w-0">
              <span class="text-xs sm:text-sm font-bold text-white truncate max-w-[200px] leading-tight font-sans">
                ${escapeHtml(g.sender)}
              </span>
              <div class="flex items-center gap-1 text-[11px] text-gray-400 mt-0.5 truncate">
                ${giftPreviewHtml}
                <span class="truncate font-medium">${escapeHtml(g.last_gift || 'Gift')}</span>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-1.5 bg-black/50 px-2.5 py-1 rounded-lg border border-white/10 shrink-0">
            <img src="/api/tiktok-coin" class="w-4 h-4 object-contain shrink-0" alt="Coin">
            <span class="font-mono text-xs sm:text-sm font-black text-amber-400 tracking-tight">
              ${(g.coins || 0).toLocaleString()}
            </span>
          </div>
        </div>
      `;
    }).join('');
  }

  function applyConfig(cfg) {
    if (!cfg) return;
    if (cfg.leaderboard_config) {
      const lc = cfg.leaderboard_config;
      if (lc.top_count) currentTopCount = Math.min(5, Math.max(1, parseInt(lc.top_count) || 5));
      if (lc.title) {
        currentHeaderTitle = lc.title;
        if (headerTitleEl) headerTitleEl.innerText = lc.title;
      }
      if (lc.scale && !urlParams.get('scale')) {
        setScale(lc.scale);
      }
    }
  }

  function escapeHtml(str) {
    return (str || '').replace(/[&<>"']/g, function(m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }

  let ws = null;
  function connectWS() {
    const WS_URL = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      console.log('Leaderboard Overlay WebSocket Connected');
    };

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.type === 'refresh_overlays') {
          window.location.reload();
          return;
        }
        if (data.type === 'init') {
          if (data.config) applyConfig(data.config);
          if (data.top_gifters) renderLeaderboard(data.top_gifters);
        } else if (data.type === 'gift' || data.type === 'leaderboard_update') {
          if (data.top_gifters) renderLeaderboard(data.top_gifters);
        } else if (data.type === 'config_updated') {
          if (data.config) applyConfig(data.config);
        }
      } catch(e) {
        console.error('Error parsing WS message', e);
      }
    };

    ws.onclose = () => {
      setTimeout(connectWS, 1500);
    };

    ws.onerror = () => {
      try { ws.close(); } catch(e) {}
    };
  }

  connectWS();
</script>
</body>
</html>
