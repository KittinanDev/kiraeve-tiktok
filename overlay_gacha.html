<!DOCTYPE html>
<html lang="th" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS:GO Mystery Box Gacha Reel Overlay</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
  :root {
    --overlay-scale: 1.0;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background: transparent;
    font-family: 'Inter', 'Kanit', sans-serif;
    color: #f1f5f9;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #scale-wrapper {
    transform: scale(var(--overlay-scale, 1));
    transform-origin: center center;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Reel Outer Frame */
  .reel-container {
    width: 760px;
    height: 190px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, #14161d 0%, #0a0b0f 100%);
    border: 2px solid rgba(255, 255, 255, 0.12);
    border-radius: 1rem;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), inset 0 0 40px rgba(0, 0, 0, 0.95);
  }

  .reel-content {
    display: flex;
    gap: 12px;
    position: absolute;
    left: 0;
    top: 14px;
    will-change: transform;
    transform: translate3d(0, 0, 0);
  }

  /* Card Styles */
  .prize-card {
    min-width: 126px;
    width: 126px;
    height: 158px;
    border-radius: 0.75rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    position: relative;
    box-sizing: border-box;
    opacity: 0.75;
    transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s, box-shadow 0.35s;
    flex-shrink: 0;
    padding: 10px 8px 8px 8px;
    user-select: none;
    border-width: 1.5px;
    border-style: solid;
    background: #181a24;
    overflow: hidden;
  }

  /* Bottom Rarity Stripe */
  .prize-card::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 4px;
  }

  /* Tier Styling */
  .prize-card.legendary {
    background: linear-gradient(180deg, rgba(30, 22, 10, 0.95) 0%, rgba(20, 15, 8, 0.98) 100%);
    border-color: rgba(245, 158, 11, 0.45);
  }
  .prize-card.legendary::after {
    background: #f59e0b;
    box-shadow: 0 0 8px #f59e0b;
  }

  .prize-card.epic {
    background: linear-gradient(180deg, rgba(28, 14, 45, 0.95) 0%, rgba(18, 10, 30, 0.98) 100%);
    border-color: rgba(192, 132, 252, 0.45);
  }
  .prize-card.epic::after {
    background: #c084fc;
    box-shadow: 0 0 8px #c084fc;
  }

  .prize-card.rare {
    background: linear-gradient(180deg, rgba(8, 30, 24, 0.95) 0%, rgba(6, 20, 16, 0.98) 100%);
    border-color: rgba(52, 211, 153, 0.45);
  }
  .prize-card.rare::after {
    background: #34d399;
    box-shadow: 0 0 8px #34d399;
  }

  .prize-card.hazard {
    background: linear-gradient(180deg, rgba(35, 10, 14, 0.95) 0%, rgba(22, 6, 9, 0.98) 100%);
    border-color: rgba(248, 113, 113, 0.45);
  }
  .prize-card.hazard::after {
    background: #f87171;
    box-shadow: 0 0 8px #f87171;
  }

  .prize-card.common {
    background: linear-gradient(180deg, rgba(22, 25, 34, 0.95) 0%, rgba(15, 17, 24, 0.98) 100%);
    border-color: rgba(148, 163, 184, 0.3);
  }
  .prize-card.common::after {
    background: #94a3b8;
  }

  .prize-card.gift {
    background: linear-gradient(180deg, rgba(40, 20, 10, 0.95) 0%, rgba(25, 12, 6, 0.98) 100%);
    border-color: rgba(251, 191, 36, 0.6);
  }
  .prize-card.gift::after {
    background: linear-gradient(90deg, #f59e0b, #ec4899);
    box-shadow: 0 0 10px #f59e0b;
  }

  /* Winner Highlight Glow */
  .prize-card.winner-glow {
    opacity: 1 !important;
    transform: scale(1.08) translate3d(0, -2px, 0);
    z-index: 35;
    animation: winnerPulse 1.2s infinite alternate ease-in-out;
  }

  .prize-card.legendary.winner-glow, .prize-card.gift.winner-glow {
    border-color: #f59e0b;
    box-shadow: 0 0 35px rgba(245, 158, 11, 0.8), 0 0 65px rgba(245, 158, 11, 0.35);
  }
  .prize-card.epic.winner-glow {
    border-color: #c084fc;
    box-shadow: 0 0 35px rgba(192, 132, 252, 0.8), 0 0 65px rgba(168, 85, 247, 0.35);
  }
  .prize-card.rare.winner-glow {
    border-color: #34d399;
    box-shadow: 0 0 35px rgba(52, 211, 153, 0.8), 0 0 65px rgba(16, 185, 129, 0.35);
  }
  .prize-card.hazard.winner-glow {
    border-color: #f87171;
    box-shadow: 0 0 35px rgba(248, 113, 113, 0.8), 0 0 65px rgba(239, 68, 68, 0.35);
  }
  .prize-card.common.winner-glow {
    border-color: #f1f5f9;
    box-shadow: 0 0 30px rgba(203, 213, 225, 0.7);
  }

  @keyframes winnerPulse {
    0% { transform: scale(1.08) translate3d(0, -2px, 0); }
    100% { transform: scale(1.12) translate3d(0, -4px, 0); }
  }

  /* Center Indicator Needle */
  .center-marker {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 2px;
    background: #ffd700;
    transform: translateX(-50%);
    z-index: 30;
    box-shadow: 0 0 14px #ffd700;
  }
  .center-marker::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 13px solid #ffd700;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
  }
  .center-marker::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-bottom: 13px solid #ffd700;
    filter: drop-shadow(0 -2px 4px rgba(0,0,0,0.8));
  }

  /* Blur Vignette Overlays */
  .blur-overlay {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 120px;
    pointer-events: none;
    z-index: 25;
  }
  .blur-left {
    left: 0;
    background: linear-gradient(90deg, #0a0b0f 15%, rgba(10, 11, 15, 0.8) 50%, rgba(10, 11, 15, 0) 100%);
  }
  .blur-right {
    right: 0;
    background: linear-gradient(270deg, #0a0b0f 15%, rgba(10, 11, 15, 0.8) 50%, rgba(10, 11, 15, 0) 100%);
  }
</style>
</head>
<body id="body-el">

  <div id="scale-wrapper">
    <!-- Viewer Spotlight Banner (Hidden per user request) -->
    <div id="viewer-spotlight" style="display: none !important;"></div>

    <!-- Main CS:GO Reel Viewport -->
    <div class="reel-container" id="gacha-viewport">
      <div class="blur-overlay blur-left"></div>
      <div class="center-marker"></div>
      <div class="reel-content" id="gacha-reel-strip">
        <!-- Placeholder items -->
      </div>
      <div class="blur-overlay blur-right"></div>
    </div>

    <!-- Result Banner -->
    <div id="result-banner" class="mt-3 flex items-center gap-2 bg-gray-900/95 border border-amber-500/40 px-4 py-1.5 rounded-full shadow-lg opacity-0 transition-opacity duration-300">
      <span class="material-symbols-outlined text-amber-400 text-[18px]">military_tech</span>
      <span class="text-xs text-gray-300 font-medium">ผลลัพธ์:</span>
      <span id="result-text" class="text-sm font-extrabold text-amber-300 font-mono">+300 วินาที</span>
      <span id="result-sync-tag" class="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 px-2 py-0.5 rounded-full font-bold">ซิงค์ Subathon สำเร็จ</span>
    </div>
  </div>

  <!-- Confetti Overlay -->
  <canvas id="vfx-confetti-canvas" class="absolute top-0 left-0 w-full h-full pointer-events-none z-[120]"></canvas>

  <!-- Audio Element -->
  <audio id="win-sound" src="/soundeffect/dragon-studio-pop-402324.mp3" preload="auto"></audio>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const isPreview = urlParams.get('preview') === 'true';
  const bodyEl = document.getElementById('body-el');
  const scaleWrapper = document.getElementById('scale-wrapper');
  const gachaReelStripEl = document.getElementById('gacha-reel-strip');
  const gachaViewportEl = document.getElementById('gacha-viewport');
  const viewerSpotlightEl = document.getElementById('viewer-spotlight');
  const viewerAvatarEl = document.getElementById('viewer-avatar');
  const viewerNameEl = document.getElementById('viewer-name');
  const viewerGiftIconEl = document.getElementById('viewer-gift-icon');
  const viewerGiftNameEl = document.getElementById('viewer-gift-name');
  const resultBannerEl = document.getElementById('result-banner');
  const resultTextEl = document.getElementById('result-text');
  const resultSyncTagEl = document.getElementById('result-sync-tag');
  const winAudioEl = document.getElementById('win-sound');

  let tickSoundEnabled = true;
  let winSoundEnabled = true;
  let autoHideEnabled = true;
  let currentOverlayScale = 1.0;

  if (isPreview) {
    scaleWrapper.style.opacity = '1';
    scaleWrapper.style.pointerEvents = 'auto';
  } else {
    scaleWrapper.style.opacity = '0';
    scaleWrapper.style.pointerEvents = 'none';
  }

  function setScale(scaleVal) {
    const s = parseFloat(scaleVal) || 1.0;
    currentOverlayScale = s;
    document.documentElement.style.setProperty('--overlay-scale', s);
  }

  // Audio Engine for Mechanical Ticking
  let audioCtx = null;
  function getAudioContext() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) {
        audioCtx = new AudioContextClass();
      }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  function playMechanicalTick(isCenterHit = false) {
    if (!tickSoundEnabled) return;
    try {
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'triangle';
      const startFreq = isCenterHit ? 1200 : 750;
      osc.frequency.setValueAtTime(startFreq, now);
      osc.frequency.exponentialRampToValueAtTime(120, now + 0.022);

      const peakGain = isCenterHit ? 0.45 : 0.28;
      gain.gain.setValueAtTime(peakGain, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.022);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + 0.025);
    } catch(e) {}
  }

  function playMechanicalLock() {
    if (!tickSoundEnabled) return;
    try {
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      [600, 950].forEach((freq, i) => {
        const t = now + i * 0.035;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t);
        osc.frequency.exponentialRampToValueAtTime(100, t + 0.03);
        gain.gain.setValueAtTime(0.4, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.035);
      });
    } catch(e) {}
  }

  // Known gift icon resolver with clean name and fallback support
  function getGiftIconUrl(giftName, rawUrl) {
    if (rawUrl && String(rawUrl).startsWith('http')) {
      return `/api/gift-icon?name=${encodeURIComponent(giftName || 'gift')}&url=${encodeURIComponent(rawUrl)}`;
    }
    if (!giftName) return '/api/gift-icon?name=Rose';
    const clean = String(giftName)
      .replace(/^(gift|ของขวัญ|ไอเทม|\ud83c\udf81)\s*[:\-]?\s*/i, '')
      .replace(/\s*\((?:ลงโหล|gift|jar|ของขวัญ)\)\s*/i, '')
      .trim();
    return `/api/gift-icon?name=${encodeURIComponent(clean || giftName)}`;
  }

  // Parse card rarity and info
  function getRarityInfo(val) {
    let text = '';
    let isGift = false;
    let giftName = '';
    let giftIcon = '';
    let customTier = 'auto';
    let customColor = '';

    if (typeof val === 'object' && val !== null) {
      text = String(val.text || val.name || '').trim();
      customTier = String(val.tier || val.rarity || 'auto').trim().toLowerCase();
      customColor = String(val.color || '').trim();
      isGift = val.type === 'gift' || val.is_gift || !!val.gift_name;
      giftName = val.gift_name || (isGift ? text : '');
      giftIcon = val.gift_icon || (isGift ? getGiftIconUrl(giftName, val.gift_icon) : '');
    } else {
      text = String(val || '').trim();
    }

    const s = text.toLowerCase();

    // Check if item text represents a gift (English & Thai names, or keywords)
    const commonGiftKeywords = [
      'rose', 'doughnut', 'donut', 'lion', 'finger heart', 'heart me', 'paper crane',
      'journey pass', 'galaxy', 'universe', 'fire phoenix', 'dragon', 'coronet', 'money gun',
      'sports car', 'cap', 'gg', 'ice cream', 'whale', 'swan', 'firework', 'heart',
      'castle', 'falcon', 'flying jet', 'rocket', 'boxing', 'trophy', 'volcano', 'cake',
      'flower', 'coffee', 'popcorn', 'balloon', 'goggles', 'mirror', 'panda', 'diamond',
      'mic', 'wink', 'love', 'perfume', 'crown', 'gamepad', 'chili', 'duck', 'star',
      'กุหลาบ', 'โดนัท', 'สิงโต', 'หัวใจ', 'มินิฮาร์ท', 'จักรวาล', 'ยูนิเวิร์ส', 'มังกร',
      'รถสปอร์ต', 'ปืนเงิน', 'หมวก', 'ไอศกรีม', 'นกกระดาษ', 'เค้ก', 'วาฬ', 'หงส์',
      'พลุ', 'ปราสาท', 'จรวด', 'มวย', 'ถ้วย', 'กาแฟ', 'ป๊อปคอร์น', 'ลูกโป่ง', 'แว่น', 'มงกุฎ'
    ];
    if (!isGift && (commonGiftKeywords.some(g => s.includes(g)) || s.includes('ของขวัญ') || s.includes('gift'))) {
      isGift = true;
      const clean = text.replace(/^(gift|ของขวัญ|ไอเทม|\ud83c\udf81)\s*[:\-]?\s*/i, '').replace(/\s*\((?:ลงโหล|gift|jar|ของขวัญ)\)\s*/i, '').trim();
      giftName = clean || text;
      giftIcon = getGiftIconUrl(giftName);
      if (customTier === 'auto') customTier = 'gift';
    }

    if (isGift) {
      const cleanName = (giftName || text).replace(/^(gift|ของขวัญ|ไอเทม|\ud83c\udf81)\s*[:\-]?\s*/i, '').replace(/\s*\((?:ลงโหล|gift|jar|ของขวัญ)\)\s*/i, '').trim();
      return {
        text,
        isGift: true,
        giftName: cleanName || text,
        giftIcon: giftIcon || getGiftIconUrl(cleanName || giftName || text),
        cls: 'gift',
        badge: 'GIFT DROP',
        colorHex: customColor || '#f59e0b',
        iconColor: 'text-amber-400'
      };
    }

    const tierMeta = {
      legendary: { cls: 'legendary', badge: 'LEGENDARY', icon: 'workspace_premium', colorHex: '#f59e0b', iconColor: 'text-amber-400' },
      epic: { cls: 'epic', badge: 'EPIC', icon: 'verified', colorHex: '#c084fc', iconColor: 'text-purple-300' },
      rare: { cls: 'rare', badge: 'RARE', icon: 'monetization_on', colorHex: '#34d399', iconColor: 'text-emerald-300' },
      hazard: { cls: 'hazard', badge: 'HAZARD', icon: 'warning', colorHex: '#f87171', iconColor: 'text-red-400' },
      common: { cls: 'common', badge: 'COMMON', icon: 'category', colorHex: '#94a3b8', iconColor: 'text-slate-300' }
    };

    let resolvedTier = 'common';
    if (customTier && customTier !== 'auto' && tierMeta[customTier]) {
      resolvedTier = customTier;
    } else {
      if (s.startsWith('-') || s.includes('ห้าม') || s.includes('ลงโทษ') || s.includes('วิดพื้น')) {
        resolvedTier = 'hazard';
      } else {
        const match = s.match(/^\+?(\d+)\s*(s|sec|m|min|h|hr)?$/);
        if (match) {
          let num = parseInt(match[1]);
          const unit = match[2] || 's';
          if (unit.startsWith('m')) num *= 60;
          else if (unit.startsWith('h')) num *= 3600;
          if (num >= 60) resolvedTier = 'legendary';
          else if (num >= 25) resolvedTier = 'epic';
          else if (num >= 5) resolvedTier = 'rare';
        }
      }
    }

    const base = tierMeta[resolvedTier] || tierMeta.common;
    return {
      text,
      isGift: false,
      giftName: '',
      giftIcon: '',
      cls: base.cls,
      badge: base.badge,
      icon: base.icon,
      colorHex: customColor || base.colorHex,
      iconColor: base.iconColor
    };
  }

  // Render a Single Prize Card HTML
  function renderCardHtml(val, idx) {
    const r = getRarityInfo(val);
    const displayVal = (typeof r.text === 'string' && r.text.startsWith('+')) ? r.text : (!isNaN(Number(r.text)) && Number(r.text) > 0 ? `+${r.text}` : r.text);

    let centerVisual = '';
    if (r.isGift) {
      centerVisual = `
        <div class="w-14 h-14 flex items-center justify-center my-auto">
          <img src="${r.giftIcon}" class="w-12 h-12 object-contain drop-shadow" alt="${escapeHtml(r.giftName)}" onerror="this.onerror=null; this.src='/api/gift-icon?name=Rose';">
        </div>
      `;
    } else {
      centerVisual = `
        <div class="w-11 h-11 rounded-xl bg-black/40 border border-white/10 flex items-center justify-center my-auto shadow">
          <span class="material-symbols-outlined ${r.iconColor} text-[24px]">${r.icon}</span>
        </div>
      `;
    }

    return `
      <div class="prize-card ${r.cls}" id="gacha-card-${idx}" data-color="${r.colorHex}">
        ${centerVisual}
        <span class="font-extrabold text-xs text-white text-center px-1 tracking-tight drop-shadow leading-tight line-clamp-2">${escapeHtml(displayVal)}</span>
      </div>
    `;
  }

  function escapeHtml(str) {
    return (str || '').replace(/[&<>"']/g, function(m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }

  // Confetti Engine
  const confettiCanvas = document.getElementById('vfx-confetti-canvas');
  let confettiCtx = confettiCanvas.getContext('2d');
  let confettiParticles = [];
  let isConfettiActive = false;

  function resizeCanvas() {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function triggerCelebrationConfetti(count = 70) {
    const colors = ['#ffd700', '#f59e0b', '#ec4899', '#8b5cf6', '#3b82f6', '#10b981', '#ffffff'];
    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;

    for (let i = 0; i < count; i++) {
      confettiParticles.push({
        x: centerX + (Math.random() - 0.5) * 200,
        y: centerY + (Math.random() - 0.5) * 60,
        vx: (Math.random() - 0.5) * 16,
        vy: (Math.random() - 0.5) * 16 - 7,
        size: Math.random() * 8 + 5,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * 360,
        rotationSpeed: (Math.random() - 0.5) * 12,
        life: 1.0,
        decay: Math.random() * 0.015 + 0.01
      });
    }

    if (!isConfettiActive) {
      isConfettiActive = true;
      requestAnimationFrame(renderConfetti);
    }
  }

  function renderConfetti() {
    confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    for (let i = confettiParticles.length - 1; i >= 0; i--) {
      const p = confettiParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.35;
      p.vx *= 0.98;
      p.rotation += p.rotationSpeed;
      p.life -= p.decay;

      if (p.life <= 0) {
        confettiParticles.splice(i, 1);
        continue;
      }

      confettiCtx.save();
      confettiCtx.translate(p.x, p.y);
      confettiCtx.rotate((p.rotation * Math.PI) / 180);
      confettiCtx.fillStyle = p.color;
      confettiCtx.globalAlpha = p.life;
      confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      confettiCtx.restore();
    }

    if (confettiParticles.length > 0) {
      requestAnimationFrame(renderConfetti);
    } else {
      isConfettiActive = false;
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    }
  }

  // Reel Spin Engine
  let isGachaSpinning = false;
  let tickAnimationId = null;

  let gachaQueue = [];
  function processGachaQueue() {
    if (isGachaSpinning || gachaQueue.length === 0) return;
    const data = gachaQueue.shift();
    runCSGOGachaSpin(data);
  }

  function runCSGOGachaSpin(data) {
    isGachaSpinning = true;

    const reelSequence = data.reel_sequence || [];
    const winnerIndex = data.winner_index !== undefined ? data.winner_index : 44;
    const durationSec = data.duration || 5;
    const winnerItem = data.winner_item || reelSequence[winnerIndex] || '+10';
    const sender = data.sender || 'Supporter';
    const senderAvatar = data.sender_avatar || '';
    const triggerGift = data.trigger_gift || 'Doughnut';
    const triggerGiftIcon = data.trigger_gift_icon || `/api/gift-icon?name=${encodeURIComponent(triggerGift)}`;

    if (viewerNameEl) viewerNameEl.innerText = sender.startsWith('@') ? sender : `@${sender}`;
    if (viewerGiftNameEl) {
      if (gachaQueue.length > 0) {
        viewerGiftNameEl.innerText = `${triggerGift} (คิวรอ: +${gachaQueue.length})`;
      } else {
        viewerGiftNameEl.innerText = triggerGift;
      }
    }
    if (viewerGiftIconEl) viewerGiftIconEl.src = triggerGiftIcon;
    if (viewerAvatarEl) {
      if (senderAvatar && senderAvatar.startsWith('http')) {
        viewerAvatarEl.src = `/api/avatar-proxy?url=${encodeURIComponent(senderAvatar)}`;
      } else {
        viewerAvatarEl.src = '/api/gift-icon?name=Rose';
      }
    }

    resultBannerEl.style.opacity = '0';
    try {
      winAudioEl.pause();
      winAudioEl.currentTime = 0;
    } catch(e) {}

    // 1. Force instant reset to 0px and cancel any previous transition
    gachaReelStripEl.style.transition = 'none';
    gachaReelStripEl.style.transform = 'translate3d(0px, 0px, 0px)';
    void gachaReelStripEl.offsetWidth; // Force reflow to commit 0px position

    // 2. Render fresh sequence of cards
    gachaReelStripEl.innerHTML = reelSequence.map((val, idx) => renderCardHtml(val, idx)).join('');
    void gachaReelStripEl.offsetWidth; // Force reflow so cards are laid out

    // Ensure wrapper is visible
    scaleWrapper.style.opacity = '1';
    scaleWrapper.style.pointerEvents = 'auto';

    requestAnimationFrame(() => {
      const viewportWidth = gachaViewportEl.clientWidth || 760;
      const viewportCenter = viewportWidth / 2;
      const targetCard = document.getElementById(`gacha-card-${winnerIndex}`);

      let targetX = 0;
      if (targetCard) {
        const cardOffsetLeft = targetCard.offsetLeft;
        const cardWidth = targetCard.offsetWidth;
        const cardCenter = cardOffsetLeft + (cardWidth / 2);
        targetX = -(cardCenter - viewportCenter);
      } else {
        targetX = -(winnerIndex * 138 - (viewportCenter - 63));
      }

      // Small delay to allow the browser to paint the reset position cleanly
      setTimeout(() => {
        gachaReelStripEl.style.transition = `transform ${durationSec}s cubic-bezier(0.1, 0.88, 0.15, 1)`;
        gachaReelStripEl.style.transform = `translate3d(${targetX}px, 0px, 0px)`;

        let lastCrossedCardIndex = -1;
        const cardPitch = 138;
        const startTime = performance.now();
        const totalDurationMs = durationSec * 1000;

        function trackTicks(now) {
          const elapsed = now - startTime;
          if (elapsed >= totalDurationMs) return;

          try {
            const transformMatrix = window.getComputedStyle(gachaReelStripEl).transform;
            if (transformMatrix && transformMatrix !== 'none') {
              const matrix = new DOMMatrixReadOnly(transformMatrix);
              const curX = matrix.m41;
              const centerPosOnStrip = -curX + viewportCenter;
              const currentCardIndex = Math.floor(centerPosOnStrip / cardPitch);

              if (currentCardIndex !== lastCrossedCardIndex && currentCardIndex >= 0 && currentCardIndex <= winnerIndex) {
                lastCrossedCardIndex = currentCardIndex;
                playMechanicalTick(currentCardIndex === winnerIndex);
              }
            }
          } catch(e) {}

          tickAnimationId = requestAnimationFrame(trackTicks);
        }

        tickAnimationId = requestAnimationFrame(trackTicks);
      }, 60);

      // On spin completed
      setTimeout(() => {
        if (tickAnimationId) cancelAnimationFrame(tickAnimationId);
        playMechanicalLock();

        const winnerCard = document.getElementById(`gacha-card-${winnerIndex}`);
        if (winnerCard) {
          winnerCard.classList.add('winner-glow');
        }

        if (winSoundEnabled) {
          try {
            winAudioEl.currentTime = 0;
            winAudioEl.play().catch(() => {});
          } catch(e) {}
        }
        triggerCelebrationConfetti(80);

        const winnerRarity = getRarityInfo(winnerItem);
        const wonGift = data.won_gift || (winnerRarity.isGift ? { name: winnerRarity.giftName, icon: winnerRarity.giftIcon } : null);

        if (wonGift) {
          resultTextEl.innerHTML = `<span class="flex items-center gap-1.5"><img src="${wonGift.icon || getGiftIconUrl(wonGift.name)}" class="w-4 h-4 object-contain inline-block"> ${escapeHtml(wonGift.name)}</span>`;
          resultSyncTagEl.innerText = 'ลงขวดโหล';
          resultSyncTagEl.className = 'text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2 py-0.5 rounded-full font-bold';
          resultSyncTagEl.style.display = 'inline-block';
        } else {
          const winnerText = (typeof winnerItem === 'object' && winnerItem !== null) ? (winnerItem.text || winnerItem.name || '') : String(winnerItem);
          const displayWinner = (typeof winnerText === 'string' && winnerText.startsWith('+')) ? winnerText : (!isNaN(Number(winnerText)) && Number(winnerText) > 0 ? `+${winnerText}` : winnerText);
          const isSec = !isNaN(parseInt(winnerText));

          resultTextEl.innerText = `${displayWinner} ${isSec ? 'วินาที' : ''}`;
          if (isSec) {
            resultSyncTagEl.innerText = 'ซิงค์ Subathon แล้ว';
            resultSyncTagEl.className = 'text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 px-2 py-0.5 rounded-full font-bold';
            resultSyncTagEl.style.display = 'inline-block';
          } else {
            resultSyncTagEl.style.display = 'none';
          }
        }
        resultBannerEl.style.opacity = '1';

        // Check if there are remaining spins in queue
        const hasMoreInQueue = gachaQueue.length > 0;
        const displayDurationMs = hasMoreInQueue ? 2200 : 4000;

        setTimeout(() => {
          if (!hasMoreInQueue) {
            if (!isPreview && autoHideEnabled) {
              scaleWrapper.style.opacity = '0';
              scaleWrapper.style.pointerEvents = 'none';
            }
          }
          isGachaSpinning = false;
          if (gachaQueue.length > 0) {
            setTimeout(processGachaQueue, 300); // Progress directly to next queued spin
          }
        }, displayDurationMs);

      }, durationSec * 1000 + 120);
    });
  }

  // Populate initial showcase preview if preview mode
  if (isPreview) {
    const defaultPreview = [
      { text: 'Rose', type: 'gift', gift_name: 'Rose' },
      { text: '+30', tier: 'epic' },
      { text: 'Lion', type: 'gift', gift_name: 'Lion' },
      { text: '+300', tier: 'legendary' },
      { text: '-30', tier: 'hazard' },
      { text: 'Doughnut', type: 'gift', gift_name: 'Doughnut' },
      { text: '+15', tier: 'common' }
    ];
    gachaReelStripEl.innerHTML = defaultPreview.map((v, i) => renderCardHtml(v, i)).join('');
  }

  // WebSocket Connection
  let ws = null;
  function connectWs() {
    const loc = window.location;
    const wsProto = loc.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${wsProto}//${loc.host}/ws`;

    ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      fetch('/api/config')
        .then(r => r.json())
        .then(cfg => {
          if (cfg && cfg.gacha_config) {
            applyConfig(cfg.gacha_config);
          }
        })
        .catch(() => {});
    };

    ws.onmessage = (evt) => {
      try {
        const msg = JSON.parse(evt.data);
        if (msg.type === 'gacha_spin') {
          gachaQueue.push(msg);
          processGachaQueue();
        } else if (msg.type === 'config_update' || msg.type === 'config_updated' || msg.type === 'init') {
          if (msg.config && msg.config.gacha_config) {
            applyConfig(msg.config.gacha_config);
          }
        } else if (msg.type === 'refresh_overlays') {
          window.location.reload();
        }
      } catch(e) {}
    };

    ws.onclose = () => {
      setTimeout(connectWs, 2000);
    };

    ws.onerror = () => {
      ws.close();
    };
  }

  function applyConfig(cfg) {
    if (!cfg) return;
    if (cfg.scale && !urlParams.get('scale')) {
      setScale(cfg.scale);
    }
    if (cfg.tick_sound_enabled !== undefined) {
      tickSoundEnabled = cfg.tick_sound_enabled;
    }
    if (cfg.win_sound_enabled !== undefined) {
      winSoundEnabled = cfg.win_sound_enabled;
    }
    if (cfg.auto_hide !== undefined) {
      autoHideEnabled = cfg.auto_hide;
    }
    if (isPreview && cfg.items && cfg.items.length > 0 && !isGachaSpinning) {
      gachaReelStripEl.innerHTML = cfg.items.map((v, i) => renderCardHtml(v, i)).join('');
    }
  }

  connectWs();
</script>
</body>
</html>
