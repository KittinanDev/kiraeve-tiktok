<!DOCTYPE html>
<html lang="th" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS:GO Mystery Box Gacha Reel Overlay</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
  :root {
    --overlay-scale: 1.0;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background: transparent;
    font-family: 'Inter', 'Kanit', sans-serif;
    color: #f1f5f9;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #scale-wrapper {
    transform: scale(var(--overlay-scale, 1));
    transform-origin: center center;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Reel Outer Frame */
  .reel-container {
    width: 760px;
    height: 195px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, #16181f 0%, #0d0e12 100%);
    border: 2px solid rgba(255, 255, 255, 0.1);
    border-radius: 1rem;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 40px rgba(0, 0, 0, 0.9);
  }

  .reel-content {
    display: flex;
    gap: 12px;
    position: absolute;
    left: 0;
    top: 15px;
    will-change: transform;
    transform: translate3d(0, 0, 0);
  }

  /* Card Styles */
  .prize-card {
    min-width: 126px;
    width: 126px;
    height: 162px;
    border-radius: 0.75rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    box-sizing: border-box;
    opacity: 0.75;
    transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s, box-shadow 0.35s;
    flex-shrink: 0;
    padding: 8px;
    user-select: none;
    border-width: 2px;
    border-style: solid;
  }

  /* Rarity Tier Themes */
  .prize-card.legendary {
    background: linear-gradient(145deg, rgba(64, 40, 5, 0.9) 0%, rgba(120, 75, 10, 0.95) 100%);
    border-color: #fbbf24;
    box-shadow: inset 0 0 15px rgba(251, 191, 36, 0.25);
  }
  .prize-card.epic {
    background: linear-gradient(145deg, rgba(40, 15, 75, 0.9) 0%, rgba(85, 25, 140, 0.95) 100%);
    border-color: #c084fc;
    box-shadow: inset 0 0 15px rgba(192, 132, 252, 0.25);
  }
  .prize-card.rare {
    background: linear-gradient(145deg, rgba(8, 45, 30, 0.9) 0%, rgba(15, 80, 55, 0.95) 100%);
    border-color: #34d399;
    box-shadow: inset 0 0 15px rgba(52, 211, 153, 0.25);
  }
  .prize-card.hazard {
    background: linear-gradient(145deg, rgba(60, 10, 15, 0.9) 0%, rgba(120, 20, 30, 0.95) 100%);
    border-color: #f87171;
    box-shadow: inset 0 0 15px rgba(248, 113, 113, 0.25);
  }
  .prize-card.common {
    background: linear-gradient(145deg, rgba(25, 30, 40, 0.9) 0%, rgba(45, 55, 70, 0.95) 100%);
    border-color: #94a3b8;
    box-shadow: inset 0 0 10px rgba(148, 163, 184, 0.15);
  }
  .prize-card.custom {
    background: linear-gradient(145deg, rgba(30, 20, 50, 0.9) 0%, rgba(60, 30, 90, 0.95) 100%);
    border-color: #ec4899;
    box-shadow: inset 0 0 15px rgba(236, 72, 153, 0.25);
  }

  /* Winner Highlight Glow & Pop */
  .prize-card.winner-glow {
    opacity: 1 !important;
    transform: scale(1.1) translate3d(0, -2px, 0);
    z-index: 35;
    animation: winnerPulse 1.2s infinite alternate ease-in-out;
  }

  .prize-card.legendary.winner-glow {
    border-color: #ffe066;
    box-shadow: 0 0 35px rgba(255, 215, 0, 0.8), 0 0 70px rgba(255, 180, 0, 0.4), inset 0 0 25px rgba(255, 215, 0, 0.5);
  }
  .prize-card.epic.winner-glow {
    border-color: #e9d5ff;
    box-shadow: 0 0 35px rgba(192, 132, 252, 0.8), 0 0 70px rgba(168, 85, 247, 0.4), inset 0 0 25px rgba(192, 132, 252, 0.5);
  }
  .prize-card.rare.winner-glow {
    border-color: #a7f3d0;
    box-shadow: 0 0 35px rgba(52, 211, 153, 0.8), 0 0 70px rgba(16, 185, 129, 0.4), inset 0 0 25px rgba(52, 211, 153, 0.5);
  }
  .prize-card.hazard.winner-glow {
    border-color: #fca5a5;
    box-shadow: 0 0 35px rgba(248, 113, 113, 0.8), 0 0 70px rgba(239, 68, 68, 0.4), inset 0 0 25px rgba(248, 113, 113, 0.5);
  }
  .prize-card.common.winner-glow {
    border-color: #f1f5f9;
    box-shadow: 0 0 35px rgba(203, 213, 225, 0.8), 0 0 60px rgba(148, 163, 184, 0.4);
  }
  .prize-card.custom.winner-glow {
    border-color: #fbcfe8;
    box-shadow: 0 0 35px rgba(236, 72, 153, 0.8), 0 0 70px rgba(219, 39, 119, 0.4), inset 0 0 25px rgba(236, 72, 153, 0.5);
  }

  @keyframes winnerPulse {
    0% { transform: scale(1.08) translate3d(0, -2px, 0); }
    100% { transform: scale(1.14) translate3d(0, -4px, 0); }
  }

  /* Center Indicator Marker */
  .center-marker {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 3px;
    background: linear-gradient(180deg, #ffd700 0%, #f59e0b 50%, #ffd700 100%);
    transform: translateX(-50%);
    z-index: 30;
    box-shadow: 0 0 16px #ffd700, 0 0 30px rgba(245, 158, 11, 0.6);
  }
  .center-marker::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-top: 14px solid #ffd700;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,0.8));
  }
  .center-marker::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-bottom: 14px solid #ffd700;
    filter: drop-shadow(0 -2px 5px rgba(0,0,0,0.8));
  }

  /* Blur Vignette Overlays */
  .blur-overlay {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 130px;
    pointer-events: none;
    z-index: 25;
  }
  .blur-left {
    left: 0;
    background: linear-gradient(90deg, #0d0e12 15%, rgba(13, 14, 18, 0.8) 50%, rgba(13, 14, 18, 0) 100%);
  }
  .blur-right {
    right: 0;
    background: linear-gradient(270deg, #0d0e12 15%, rgba(13, 14, 18, 0.8) 50%, rgba(13, 14, 18, 0) 100%);
  }

  /* Card Shimmer Animation */
  .shimmer-badge {
    background-size: 200% auto;
    animation: shimmerGlow 2.5s linear infinite;
  }
  @keyframes shimmerGlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
</style>
</head>
<body id="body-el">

  <div id="scale-wrapper">
    <!-- Viewer Spotlight Banner (Shows who opened the box) -->
    <div id="viewer-spotlight" class="mb-3 flex items-center gap-3 bg-gray-900/95 border border-purple-500/40 px-4 py-2 rounded-full shadow-2xl backdrop-blur-md transition-all duration-300">
      <img id="viewer-avatar" src="/api/avatar-proxy?url=https://p16-va-tiktok.ibyteimg.com/img/musically-maliva-obj/default-avatar.jpeg" class="w-8 h-8 rounded-full border-2 border-purple-400 object-cover shadow-sm" onerror="this.src='/api/gift-icon?name=Rose'">

        <div class="flex items-center gap-1.5 bg-purple-950/60 border border-purple-500/30 px-2.5 py-0.5 rounded-full">
          <img id="viewer-gift-icon" src="/api/gift-icon?name=Doughnut" class="w-5 h-5 object-contain">

    <div class="reel-container" id="gacha-viewport">

      <div class="reel-content" id="gacha-reel-strip">
        <!-- Default Initial Showcase Cards -->
        <div class="prize-card rare">
          <div class="w-11 h-11 rounded-full bg-emerald-950/70 border border-emerald-500/50 flex items-center justify-center mb-1 shadow">

    <!-- Result Banner (Below Reel) -->
    <div id="result-banner" class="mt-3 flex items-center gap-2 bg-gray-900/90 border border-amber-500/40 px-4 py-1.5 rounded-full shadow-lg opacity-0 transition-opacity duration-300">
      <span class="material-symbols-outlined text-amber-400 text-[18px]">military_tech</span>
      <span class="text-xs text-gray-300 font-medium">ผลลัพธ์:</span>

  <!-- HTML5 Canvas Confetti Overlay -->
  <canvas id="vfx-confetti-canvas" class="absolute top-0 left-0 w-full h-full pointer-events-none z-[120]"></canvas>

  <!-- Audio Element for Winning Pop -->
  <audio id="win-sound" src="/soundeffect/dragon-studio-pop-402324.mp3" preload="auto"></audio>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const isPreview = urlParams.get('preview') === 'true';
  const bodyEl = document.getElementById('body-el');
  const scaleWrapper = document.getElementById('scale-wrapper');
  const gachaReelStripEl = document.getElementById('gacha-reel-strip');
  const gachaViewportEl = document.getElementById('gacha-viewport');
  const viewerSpotlightEl = document.getElementById('viewer-spotlight');
  const viewerAvatarEl = document.getElementById('viewer-avatar');
  const viewerNameEl = document.getElementById('viewer-name');
  const viewerGiftIconEl = document.getElementById('viewer-gift-icon');
  const viewerGiftNameEl = document.getElementById('viewer-gift-name');
  const resultBannerEl = document.getElementById('result-banner');
  const resultTextEl = document.getElementById('result-text');
  const resultSyncTagEl = document.getElementById('result-sync-tag');
  const winAudioEl = document.getElementById('win-sound');

  let tickSoundEnabled = true;
  let winSoundEnabled = true;
  let autoHideEnabled = true;
  let currentOverlayScale = 1.0;

  // Set initial visibility
  if (isPreview) {
    scaleWrapper.style.opacity = '1';
    scaleWrapper.style.pointerEvents = 'auto';
  } else {
    scaleWrapper.style.opacity = '0';
    scaleWrapper.style.pointerEvents = 'none';
  }

  function setScale(scaleVal) {
    const s = parseFloat(scaleVal) || 1.0;
    currentOverlayScale = s;
    document.documentElement.style.setProperty('--overlay-scale', s);
  }

  // --- Web Audio API Mechanical Ticking Synthesizer ---
  let audioCtx = null;
  function getAudioContext() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) {
        audioCtx = new AudioContextClass();
      }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  function playMechanicalTick(isCenterHit = false) {
    if (!tickSoundEnabled) return;
    try {
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'triangle';
      const startFreq = isCenterHit ? 1200 : 750;
      osc.frequency.setValueAtTime(startFreq, now);
      osc.frequency.exponentialRampToValueAtTime(120, now + 0.022);

      const peakGain = isCenterHit ? 0.45 : 0.28;
      gain.gain.setValueAtTime(peakGain, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.022);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + 0.025);
    } catch(e) {}
  }

  function playMechanicalLock() {
    if (!tickSoundEnabled) return;
    try {
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      
      // Dual click lock effect
      [600, 950].forEach((freq, i) => {
        const t = now + i * 0.035;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t);
        osc.frequency.exponentialRampToValueAtTime(100, t + 0.03);
        gain.gain.setValueAtTime(0.4, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.035);
      });
    } catch(e) {}
  }

  // --- Card Rarity Classifier ---
  let currentRarityNames = {
    legendary: 'LEGENDARY',
    epic: 'EPIC',
    rare: 'RARE',
    common: 'COMMON',
    hazard: 'HAZARD',
    custom: 'CUSTOM'
  };

  function getRarityInfo(val) {
    let text = '';
    let customTier = 'auto';
    let customColor = '';
    let customRarityName = '';

    if (typeof val === 'object' && val !== null) {
      text = String(val.text || val.name || '').trim();
      customTier = String(val.tier || val.rarity || 'auto').trim().toLowerCase();
      customColor = String(val.color || '').trim();
      customRarityName = String(val.rarity_name || val.rarity_label || val.badge || '').trim();
    } else {
      text = String(val || '').trim();
    }

    const s = text.toLowerCase();

    // Standard Tier Metadata Table
    const tierMeta = {
      legendary: {
        cls: 'legendary',
        badge: 'LEGENDARY',
        icon: 'workspace_premium',
        colorHex: '#fbbf24',
        iconColor: 'text-amber-300',
        bgIcon: 'bg-amber-950/70',
        borderIcon: 'border-amber-400/60'
      },
      epic: {
        cls: 'epic',
        badge: 'EPIC',
        icon: 'verified',
        colorHex: '#c084fc',
        iconColor: 'text-purple-300',
        bgIcon: 'bg-purple-950/70',
        borderIcon: 'border-purple-500/50'
      },
      rare: {
        cls: 'rare',
        badge: 'RARE',
        icon: 'monetization_on',
        colorHex: '#34d399',
        iconColor: 'text-emerald-300',
        bgIcon: 'bg-emerald-950/70',
        borderIcon: 'border-emerald-500/50'
      },
      hazard: {
        cls: 'hazard',
        badge: 'HAZARD',
        icon: 'warning',
        colorHex: '#f87171',
        iconColor: 'text-red-400',
        bgIcon: 'bg-red-950/70',
        borderIcon: 'border-red-500/50'
      },
      common: {
        cls: 'common',
        badge: 'COMMON',
        icon: 'category',
        colorHex: '#94a3b8',
        iconColor: 'text-slate-300',
        bgIcon: 'bg-slate-800/80',
        borderIcon: 'border-slate-600/50'
      },
      custom: {
        cls: 'custom',
        badge: 'CUSTOM',
        icon: 'stars',
        colorHex: customColor || '#ec4899',
        iconColor: 'text-pink-300',
        bgIcon: 'bg-pink-950/70',
        borderIcon: 'border-pink-500/50'
      }
    };

    let resolvedTier = 'common';
    if (customTier && customTier !== 'auto' && tierMeta[customTier]) {
      resolvedTier = customTier;
    } else {
      // Auto detection based on text
      if (s.startsWith('-') || s.includes('ห้าม') || s.includes('ลงโทษ') || s.includes('วิดพื้น') || s.includes('สควอท')) {
        resolvedTier = 'hazard';
      } else {
        const match = s.match(/^\+?(\d+)\s*(s|sec|m|min|h|hr)?$/);
        if (match) {
          let num = parseInt(match[1]);
          const unit = match[2] || 's';
          if (unit.startsWith('m')) num *= 60;
          else if (unit.startsWith('h')) num *= 3600;
          if (num >= 60) resolvedTier = 'legendary';
          else if (num >= 25) resolvedTier = 'epic';
          else if (num >= 5) resolvedTier = 'rare';
        }
      }
    }

    const base = tierMeta[resolvedTier] || tierMeta.common;
    const finalColor = customColor || base.colorHex;

    // Effective Rarity Badge Name (Per-item custom name > Global tier custom name > Default tier badge)
    const effectiveBadge = customRarityName || (currentRarityNames && currentRarityNames[resolvedTier]) || base.badge;

    // Inline styles if custom color specified or custom tier
    let cardInlineStyle = '';
    let iconInlineStyle = '';
    let badgeInlineStyle = '';

    if (customColor || resolvedTier === 'custom') {
      cardInlineStyle = `border-color: ${finalColor} !important; background: linear-gradient(145deg, ${finalColor}22 0%, ${finalColor}44 100%) !important; box-shadow: inset 0 0 15px ${finalColor}40 !important;`;
      iconInlineStyle = `background-color: ${finalColor}2e !important; border-color: ${finalColor}88 !important; color: ${finalColor} !important;`;
      badgeInlineStyle = `color: ${finalColor} !important;`;
    }

    return {
      text,
      cls: base.cls,
      badge: effectiveBadge,
      icon: base.icon,
      colorHex: finalColor,
      iconColor: (customColor || resolvedTier === 'custom') ? '' : base.iconColor,
      bgIcon: (customColor || resolvedTier === 'custom') ? '' : base.bgIcon,
      borderIcon: (customColor || resolvedTier === 'custom') ? '' : base.borderIcon,
      cardInlineStyle,
      iconInlineStyle,
      badgeInlineStyle
    };
  }

  // --- Confetti Engine ---
  const confettiCanvas = document.getElementById('vfx-confetti-canvas');
  let confettiCtx = confettiCanvas.getContext('2d');
  let confettiParticles = [];
  let isConfettiActive = false;

  function resizeCanvas() {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function triggerCelebrationConfetti(count = 70) {
    const colors = ['#ffd700', '#f59e0b', '#ec4899', '#8b5cf6', '#3b82f6', '#10b981', '#ffffff'];
    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;

    for (let i = 0; i < count; i++) {
      confettiParticles.push({
        x: centerX + (Math.random() - 0.5) * 200,
        y: centerY + (Math.random() - 0.5) * 60,
        vx: (Math.random() - 0.5) * 16,
        vy: (Math.random() - 0.5) * 16 - 7,
        size: Math.random() * 8 + 5,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * 360,
        rotationSpeed: (Math.random() - 0.5) * 12,
        life: 1.0,
        decay: Math.random() * 0.015 + 0.01
      });
    }

    if (!isConfettiActive) {
      isConfettiActive = true;
      requestAnimationFrame(renderConfetti);
    }
  }

  function renderConfetti() {
    confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    for (let i = confettiParticles.length - 1; i >= 0; i--) {
      const p = confettiParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.35; // gravity
      p.vx *= 0.98;
      p.rotation += p.rotationSpeed;
      p.life -= p.decay;

      if (p.life <= 0) {
        confettiParticles.splice(i, 1);
        continue;
      }

      confettiCtx.save();
      confettiCtx.translate(p.x, p.y);
      confettiCtx.rotate((p.rotation * Math.PI) / 180);
      confettiCtx.fillStyle = p.color;
      confettiCtx.globalAlpha = p.life;
      confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      confettiCtx.restore();
    }

    if (confettiParticles.length > 0) {
      requestAnimationFrame(renderConfetti);
    } else {
      isConfettiActive = false;
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    }
  }

  // --- Reel Spin Engine with Physics & Real-Time Mechanical Ticking ---
  let isGachaSpinning = false;
  let tickAnimationId = null;

  function runCSGOGachaSpin(data) {
    if (isGachaSpinning) return;
    isGachaSpinning = true;

    const reelSequence = data.reel_sequence || [];
    const winnerIndex = data.winner_index !== undefined ? data.winner_index : 44;
    const durationSec = data.duration || 5;
    const winnerItem = data.winner_item || reelSequence[winnerIndex] || '+10';
    const sender = data.sender || 'Supporter_VIP';
    const senderAvatar = data.sender_avatar || '';
    const triggerGift = data.trigger_gift || 'Doughnut';
    const triggerGiftIcon = data.trigger_gift_icon || `/api/gift-icon?name=${encodeURIComponent(triggerGift)}`;

    // Update Spotlight Banner
    if (viewerNameEl) viewerNameEl.innerText = sender.startsWith('@') ? sender : `@${sender}`;
    if (viewerGiftNameEl) viewerGiftNameEl.innerText = triggerGift;
    if (viewerGiftIconEl) viewerGiftIconEl.src = triggerGiftIcon;
    if (viewerAvatarEl) {
      if (senderAvatar && senderAvatar.startsWith('http')) {
        viewerAvatarEl.src = `/api/avatar-proxy?url=${encodeURIComponent(senderAvatar)}`;
      } else {
        viewerAvatarEl.src = '/api/gift-icon?name=Rose';
      }
    }

    // Hide result banner
    resultBannerEl.style.opacity = '0';

    // Render cards
    gachaReelStripEl.innerHTML = reelSequence.map((val, idx) => {
      const rarity = getRarityInfo(val);
      const isWinner = idx === winnerIndex;
      const displayVal = (typeof rarity.text === 'string' && rarity.text.startsWith('+')) ? rarity.text : (!isNaN(Number(rarity.text)) && Number(rarity.text) > 0 ? `+${rarity.text}` : rarity.text);
      return `
        <div class="prize-card ${rarity.cls}" id="gacha-card-${idx}" style="${rarity.cardInlineStyle}" data-color="${rarity.colorHex}">
          <div class="w-11 h-11 rounded-full ${rarity.bgIcon} border ${rarity.borderIcon} flex items-center justify-center mb-1.5 shadow" style="${rarity.iconInlineStyle}">
            <span class="material-symbols-outlined ${rarity.iconColor} text-[26px]" style="${rarity.iconInlineStyle}">${rarity.icon}</span>
          </div>
          <span class="font-extrabold text-base text-white text-center px-1 tracking-tight drop-shadow leading-tight line-clamp-2">${displayVal}</span>
          <span class="font-mono text-[9.5px] ${rarity.iconColor} font-extrabold mt-1 tracking-wider uppercase opacity-95 px-1 truncate max-w-full text-center block" style="${rarity.badgeInlineStyle}">${rarity.badge}</span>
        </div>
      `;
    }).join('');

    // Reset Strip to Start
    gachaReelStripEl.style.transition = 'none';
    gachaReelStripEl.style.transform = 'translate3d(0px, 0px, 0px)';
    scaleWrapper.style.opacity = '1';
    scaleWrapper.style.pointerEvents = 'auto';

    // Layout calculation
    requestAnimationFrame(() => {
      const viewportWidth = gachaViewportEl.clientWidth || 760;
      const viewportCenter = viewportWidth / 2;
      const targetCard = document.getElementById(`gacha-card-${winnerIndex}`);

      let targetX = 0;
      if (targetCard) {
        const cardOffsetLeft = targetCard.offsetLeft;
        const cardWidth = targetCard.offsetWidth;
        const cardCenter = cardOffsetLeft + (cardWidth / 2);
        targetX = -(cardCenter - viewportCenter);
      } else {
        // Card width is 126px + 12px gap = 138px pitch
        targetX = -(winnerIndex * 138 - (viewportCenter - 63));
      }

      // Physics deceleration: starts fast, smoothly glides and halts right on center marker
      setTimeout(() => {
        gachaReelStripEl.style.transition = `transform ${durationSec}s cubic-bezier(0.1, 0.88, 0.15, 1)`;
        gachaReelStripEl.style.transform = `translate3d(${targetX}px, 0px, 0px)`;

        // Start real-time mechanical ticking tracking
        let lastCrossedCardIndex = -1;
        const cardPitch = 138; // 126px card + 12px gap
        const startTime = performance.now();
        const totalDurationMs = durationSec * 1000;

        function trackTicks(now) {
          const elapsed = now - startTime;
          if (elapsed >= totalDurationMs) {
            return;
          }

          try {
            const transformMatrix = window.getComputedStyle(gachaReelStripEl).transform;
            if (transformMatrix && transformMatrix !== 'none') {
              const matrix = new DOMMatrixReadOnly(transformMatrix);
              const curX = matrix.m41;
              const centerPosOnStrip = -curX + viewportCenter;
              const currentCardIndex = Math.floor(centerPosOnStrip / cardPitch);

              if (currentCardIndex !== lastCrossedCardIndex && currentCardIndex >= 0 && currentCardIndex <= winnerIndex) {
                lastCrossedCardIndex = currentCardIndex;
                playMechanicalTick(currentCardIndex === winnerIndex);
              }
            }
          } catch(e) {}

          tickAnimationId = requestAnimationFrame(trackTicks);
        }

        tickAnimationId = requestAnimationFrame(trackTicks);
      }, 50);

      // End of Spin Celebration & Landing
      setTimeout(() => {
        if (tickAnimationId) cancelAnimationFrame(tickAnimationId);
        playMechanicalLock();

        const winnerCard = document.getElementById(`gacha-card-${winnerIndex}`);
        if (winnerCard) {
          winnerCard.classList.add('winner-glow');
          const cardColor = winnerCard.getAttribute('data-color');
          if (cardColor) {
            winnerCard.style.boxShadow = `0 0 35px ${cardColor}cc, 0 0 70px ${cardColor}66, inset 0 0 25px ${cardColor}88`;
            winnerCard.style.borderColor = cardColor;
          }
        }

        // Play Win Sound & Particle Confetti
        if (winSoundEnabled) {
          try {
            winAudioEl.currentTime = 0;
            winAudioEl.play().catch(() => {});
          } catch(e) {}
        }
        triggerCelebrationConfetti(85);

        // Show Result Banner
        const winnerText = (typeof winnerItem === 'object' && winnerItem !== null) ? (winnerItem.text || winnerItem.name || '') : String(winnerItem);
        const displayWinner = (typeof winnerText === 'string' && winnerText.startsWith('+')) ? winnerText : (!isNaN(Number(winnerText)) && Number(winnerText) > 0 ? `+${winnerText}` : winnerText);
        const isSec = !isNaN(parseInt(winnerText));
        const wonGift = data.won_gift || (typeof winnerItem === 'object' && (winnerItem.type === 'gift' || winnerItem.is_gift) ? { name: winnerItem.gift_name || winnerItem.text } : null);

        if (wonGift) {
          resultTextEl.innerText = `🎁 ${wonGift.name}`;
          resultSyncTagEl.innerText = '🫙 ส่งเข้า Jar สำเร็จ';
          resultSyncTagEl.className = 'text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2 py-0.5 rounded-full font-bold';
          resultSyncTagEl.style.display = 'inline-block';
        } else {
          resultTextEl.innerText = `${displayWinner} ${isSec ? 'วินาที' : ''}`;
          if (isSec) {
            resultSyncTagEl.innerText = '⏱️ ซิงค์ Subathon สำเร็จ';
            resultSyncTagEl.className = 'text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 px-2 py-0.5 rounded-full font-bold';
            resultSyncTagEl.style.display = 'inline-block';
          } else {
            resultSyncTagEl.style.display = 'none';
          }
        }
        resultBannerEl.style.opacity = '1';

        // Auto Hide after 4 seconds if enabled (unless preview mode)
        setTimeout(() => {
          if (!isPreview && autoHideEnabled) {
            scaleWrapper.style.transition = 'opacity 0.8s ease-out';
            scaleWrapper.style.opacity = '0';
            scaleWrapper.style.pointerEvents = 'none';
          }
        }, 4000);

        isGachaSpinning = false;
      }, durationSec * 1000 + 150);

    }, 50);
  }

  function renderStaticPreviewCards(items) {
    if (!items || items.length === 0 || isGachaSpinning) return;
    gachaReelStripEl.innerHTML = items.map((val, idx) => {
      const rarity = getRarityInfo(val);
      const isCenter = idx === Math.floor(items.length / 2);
      const displayVal = (typeof rarity.text === 'string' && rarity.text.startsWith('+')) ? rarity.text : (!isNaN(Number(rarity.text)) && Number(rarity.text) > 0 ? `+${rarity.text}` : rarity.text);
      return `
        <div class="prize-card ${rarity.cls} ${isCenter ? 'winner-glow' : ''}" style="${rarity.cardInlineStyle}" data-color="${rarity.colorHex}">
          <div class="w-11 h-11 rounded-full ${rarity.bgIcon} border ${rarity.borderIcon} flex items-center justify-center mb-1.5 shadow" style="${rarity.iconInlineStyle}">
            <span class="material-symbols-outlined ${rarity.iconColor} text-[26px]" style="${rarity.iconInlineStyle}">${rarity.icon}</span>
          </div>
          <span class="font-extrabold text-base text-white text-center px-1 tracking-tight drop-shadow leading-tight line-clamp-2">${displayVal}</span>
          <span class="font-mono text-[9.5px] ${rarity.iconColor} font-extrabold mt-1 tracking-wider uppercase opacity-95 px-1 truncate max-w-full text-center block" style="${rarity.badgeInlineStyle}">${rarity.badge}</span>
        </div>
      `;
    }).join('');
  }

  // --- WebSocket Connection ---
  const WS_URL = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
  let ws = null;

  function connectWS() {
    ws = new WebSocket(WS_URL);

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.type === 'refresh_overlays') {
          window.location.reload();
          return;
        }
        if (data.type === 'init') {
          if (data.config && data.config.gacha_config) {
            const gc = data.config.gacha_config;
            if (gc.scale) setScale(gc.scale);
            if (gc.tick_sound_enabled !== undefined) tickSoundEnabled = gc.tick_sound_enabled;
            if (gc.win_sound_enabled !== undefined) winSoundEnabled = gc.win_sound_enabled;
            if (gc.auto_hide !== undefined) autoHideEnabled = gc.auto_hide;
            if (gc.rarity_names) currentRarityNames = Object.assign(currentRarityNames, gc.rarity_names);
            if (isPreview && gc.items && gc.items.length > 0) renderStaticPreviewCards(gc.items);
          }
        } else if (data.type === 'config_updated') {
          if (data.config && data.config.gacha_config) {
            const gc = data.config.gacha_config;
            if (gc.scale) setScale(gc.scale);
            if (gc.tick_sound_enabled !== undefined) tickSoundEnabled = gc.tick_sound_enabled;
            if (gc.win_sound_enabled !== undefined) winSoundEnabled = gc.win_sound_enabled;
            if (gc.auto_hide !== undefined) autoHideEnabled = gc.auto_hide;
            if (gc.rarity_names) currentRarityNames = Object.assign(currentRarityNames, gc.rarity_names);
            if (isPreview && gc.items && gc.items.length > 0) renderStaticPreviewCards(gc.items);
          }
        } else if (data.type === 'gacha_spin') {
          if (data.config) {
            if (data.config.scale) setScale(data.config.scale);
            if (data.config.tick_sound_enabled !== undefined) tickSoundEnabled = data.config.tick_sound_enabled;
            if (data.config.win_sound_enabled !== undefined) winSoundEnabled = data.config.win_sound_enabled;
            if (data.config.auto_hide !== undefined) autoHideEnabled = data.config.auto_hide;
            if (data.config.rarity_names) currentRarityNames = Object.assign(currentRarityNames, data.config.rarity_names);
          }
          runCSGOGachaSpin(data);
        }
      } catch(e) {}
    };

    ws.onclose = () => {
      setTimeout(connectWS, 2000);
    };
  }

  connectWS();

  // Demo parameter support for instant visual test and headless screenshots
  const demoParam = urlParams.get('demo');
  if (demoParam === 'winner') {
    setTimeout(() => {
      runCSGOGachaSpin({
        reel_sequence: ['+10', '+15', '-30', '+30', '+300', '+60', '-15'],
        winner_index: 4,
        winner_item: '+300',
        duration: 0.05,
        sender: 'Kaneo_Gamer',
        trigger_gift: 'Doughnut'
      });
    }, 100);
  } else if (demoParam === 'spin') {
    setTimeout(() => {
      runCSGOGachaSpin({
        reel_sequence: ['+10', '+15', '-30', '+30', '+300', '+60', '-15', '+10', '+45', '-60', '+30', '+15', '+300'],
        winner_index: 8,
        winner_item: '+45',
        duration: 8,
        sender: 'Alice_VIP',
        trigger_gift: 'Doughnut'
      });
    }, 100);
  } else if (demoParam === 'custom') {
    setTimeout(() => {
      runCSGOGachaSpin({
        reel_sequence: [
          { text: '+10', tier: 'rare', color: '#34d399' },
          { text: '+30', tier: 'epic', color: '#c084fc' },
          { text: 'เล่นเกมตามสั่ง', tier: 'custom', color: '#06b6d4' },
          { text: '+60', tier: 'legendary', color: '#fbbf24' },
          { text: 'แจก VIP 1 เดือน', tier: 'custom', color: '#ec4899' },
          { text: '+300', tier: 'legendary', color: '#f59e0b' },
          { text: '-30', tier: 'hazard', color: '#f87171' }
        ],
        winner_index: 4,
        winner_item: { text: 'แจก VIP 1 เดือน', tier: 'custom', color: '#ec4899' },
        duration: 0.05,
        sender: 'Queen_VIP',
        trigger_gift: 'Doughnut'
      });
    }, 100);
  } else if (demoParam === 'custom_rarity') {
    setTimeout(() => {
      runCSGOGachaSpin({
        reel_sequence: [
          { text: '+30s', tier: 'rare', rarity_name: 'R ⭐', color: '#34d399' },
          { text: '+60s', tier: 'epic', rarity_name: 'SR ⭐⭐', color: '#c084fc' },
          { text: '+300s โบนัสใหญ่', tier: 'legendary', rarity_name: 'SSR 👑', color: '#fbbf24' },
          { text: '-30s ลดเวลา', tier: 'hazard', rarity_name: 'DEBUFF 💀', color: '#f87171' },
          { text: 'วิดพื้น 10 ครั้ง', tier: 'custom', rarity_name: 'ทำโทษ 🏋️', color: '#ec4899' }
        ],
        winner_index: 2,
        winner_item: { text: '+300s โบนัสใหญ่', tier: 'legendary', rarity_name: 'SSR 👑', color: '#fbbf24' },
        duration: 0.05,
        sender: 'Alice_VIP',
        trigger_gift: 'Doughnut'
      });
    }, 100);
  }

  // Allow clicking anywhere to unlock Web Audio API if needed
  window.addEventListener('click', () => {
    getAudioContext();
  });
</script>
