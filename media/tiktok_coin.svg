<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Outer gold ring gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3A8"/>
      <stop offset="35%" stop-color="#FFD000"/>
      <stop offset="70%" stop-color="#E69500"/>
      <stop offset="100%" stop-color="#A56100"/>
    </linearGradient>
    <!-- Inner gold face gradient -->
    <linearGradient id="goldFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDE43"/>
      <stop offset="50%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#E08B00"/>
    </linearGradient>
    <!-- Emboss bevel gradient -->
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE875"/>
      <stop offset="100%" stop-color="#B87200"/>
    </linearGradient>
    <!-- Soft shadow filter -->
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Bevel Base -->
  <circle cx="24" cy="24" r="22" fill="url(#goldRim)" filter="url(#drop)"/>
  
  <!-- Outer Rim Ring -->
  <circle cx="24" cy="24" r="20" fill="#B26B00"/>
  
  <!-- Inner Coin Face -->
  <circle cx="24" cy="24" r="18.5" fill="url(#goldFace)"/>

  <!-- Inner Milled Ridge Line -->
  <circle cx="24" cy="24" r="16.5" fill="none" stroke="#FFA700" stroke-width="1" stroke-dasharray="2.5 1.5" opacity="0.6"/>

  <!-- Inner Embossed Border -->
  <circle cx="24" cy="24" r="14.5" fill="none" stroke="url(#bevelGrad)" stroke-width="1.2" opacity="0.8"/>

  <!-- Center TikTok Brand Note glyph with Gold Emboss -->
  <!-- Shadow of symbol -->
  <path d="M28.5 13.5 C29.5 15.5 31.5 17 34 17.2 L34 20 C32 20 30.2 19.2 28.5 18 L28.5 27 C28.5 31.5 24.8 34.5 20.5 34.5 C16.5 34.5 13.5 31.5 13.5 27.5 C13.5 23.5 16.8 20.5 21 20.5 C21.6 20.5 22.2 20.6 22.8 20.7 L22.8 23.8 C22.2 23.6 21.6 23.5 21 23.5 C18.5 23.5 16.5 25.2 16.5 27.5 C16.5 29.8 18.2 31.5 20.5 31.5 C23 31.5 25.2 29.5 25.2 27 L25.2 13.5 Z" 
        fill="#A05A00" transform="translate(0, 0.8)"/>

  <!-- Main Symbol (Sharp Gold Emboss) -->
  <path d="M28.5 13.5 C29.5 15.5 31.5 17 34 17.2 L34 20 C32 20 30.2 19.2 28.5 18 L28.5 27 C28.5 31.5 24.8 34.5 20.5 34.5 C16.5 34.5 13.5 31.5 13.5 27.5 C13.5 23.5 16.8 20.5 21 20.5 C21.6 20.5 22.2 20.6 22.8 20.7 L22.8 23.8 C22.2 23.6 21.6 23.5 21 23.5 C18.5 23.5 16.5 25.2 16.5 27.5 C16.5 29.8 18.2 31.5 20.5 31.5 C23 31.5 25.2 29.5 25.2 27 L25.2 13.5 Z" 
        fill="#FFF4B8"/>

  <!-- Top Curved Specular Highlight -->
  <path d="M8 20 A 18 18 0 0 1 40 20 A 18 15 0 0 0 8 20 Z" fill="#FFFFFF" opacity="0.35"/>
</svg>